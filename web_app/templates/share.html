<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph / Social (updated dynamically by JS after chart loads) -->
    <meta property="og:title" content="Charthawk — Chart Audit">
    <meta property="og:description" content="See this chart audit on Charthawk — AI-powered chart analysis that spots misleading axes, cherry-picked ranges, and distorted scales.">
    <meta property="og:image" content="https://charthawk.info/static/og-image.png">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Charthawk">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://charthawk.info/static/og-image.png">
    <meta name="description" content="AI-powered chart audit on Charthawk.">
    <meta name="description" content="AI-powered chart audit on Charthawk — see what the data is really hiding.">
    <meta property="og:title" content="Chart Audit — Charthawk">
    <meta property="og:description" content="An AI-powered audit flagging misleading chart patterns. Audit your own charts free.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://charthawk.info/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chart Audit — Charthawk">
    <meta name="twitter:description" content="AI-powered chart forensics. See what this chart is really hiding.">
    <meta name="twitter:image" content="https://charthawk.info/og-image.png">
    <title>Charthawk — Chart Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='26' fill='%231F3A5F'/><path d='M84 36A34 34 0 1 0 84 84' fill='none' stroke='%23F2E35B' stroke-width='16' stroke-linecap='round'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --navy:        #1F3A5F;
            --bg-base:     #0F1E33;
            --bg-surface:  #132744;
            --bg-card:     #16294A;
            --bg-input:    #1A3256;
            --border:      #2C4A72;
            --text-primary:#F2F5F9;
            --text-muted:  #A9B7CA;
            --accent:      #F2E35B;
            --accent-ink:  #13243B;
            --accent-dim:  rgba(242,227,91,0.12);
            --success:     #4ade80;
            --danger:      #f87171;
            --font-display:'Oswald', 'Arial Narrow', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-base); color: var(--text-primary); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }


        /* Brand header (shared look with share page) */
        .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; background: var(--navy); border-bottom: 0; position: sticky; top: 0; z-index: 10; }
        .header-brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
        .header-brand span { font-family: var(--font-display); font-weight: 500; font-size: 17px; letter-spacing: 0.22em; color: #fff; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-ghost { display: inline-flex; align-items: center; min-height: 40px; background: transparent; border: 1px solid #4A6A94; color: #DCE3EC; padding: 0 16px; border-radius: 999px; font-size: 0.85em; font-weight: 500; text-decoration: none; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-accent { display: inline-flex; align-items: center; min-height: 40px; background: var(--accent); border: none; color: var(--accent-ink); padding: 0 18px; border-radius: 999px; font-size: 0.85em; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 0.15s; font-family: inherit; }
        .btn-accent:hover { background: #E2D140; }

        /* Main layout */
        .page-body { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }

        /* Chart image */
        .chart-img { width: 100%; border-radius: 16px; border: 1px solid var(--border); display: block; margin-bottom: 28px; background: #fff; }

        /* Title block */
        .chart-meta { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
        .chart-meta-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .public-pill { font-size: 0.75em; font-weight: 600; color: var(--accent-ink); background: #E8EDF3; padding: 4px 10px; border-radius: 999px; }
        .chart-name { font-family: var(--font-display); font-size: 2.4em; font-weight: 600; line-height: 1.1; }
        .chart-subtitle { font-size: 1em; color: var(--text-muted); line-height: 1.5; }
        .chart-date { font-size: 0.85em; color: var(--text-muted); }
        .copy-link-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 0 16px; border-radius: 12px; font-size: 0.88em; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; }
        .copy-link-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Section jump links */
        .jump-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
        .jump-links a { font-size: 0.82em; color: #C9D3E0; text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; transition: all 0.15s; }
        .jump-links a:hover { border-color: var(--accent); color: var(--accent); }
        .jump-links a.warn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

        /* Analysis */
        .analysis-content { font-size: 1em; line-height: 1.65; color: #D3DCE7; }
        .analysis-content > h1 { display: none; }
        .analysis-content h2 { display: flex; align-items: center; gap: 10px; font-size: 1.2em; font-weight: 700; color: var(--text-primary); margin: 32px 0 10px; scroll-margin-top: 88px; }
        .analysis-content h2 .sec-num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; background: #2C4A72; color: #fff; font-family: var(--font-display); font-size: 0.85em; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
        .analysis-content h3 { font-size: 1em; font-weight: 600; margin: 16px 0 4px; color: var(--text-primary); }
        .analysis-content p  { margin-bottom: 12px; }
        .analysis-content ul, .analysis-content ol { padding-left: 22px; margin-bottom: 12px; }
        .analysis-content li { margin-bottom: 6px; }
        .analysis-content strong { color: #fff; }
        .analysis-section.misread { background: #2A2A1A; border: 1px solid #6B6326; border-radius: 16px; padding: 4px 20px 10px; margin: 24px 0; color: #ECE7C8; }
        .analysis-section.misread h2 { color: var(--accent); margin-top: 18px; }
        .analysis-section.misread h2 .sec-num { background: var(--accent); color: var(--accent-ink); }

        /* Conversation thread */
        .section-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
        .section-label { font-size: 0.75em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }
        .msg-bubble { padding: 12px 16px; border-radius: 10px; font-size: 0.88em; line-height: 1.6; margin-bottom: 10px; max-width: 90%; }
        .msg-bubble.user { background: var(--accent-dim); border: 1px solid rgba(242,227,91,0.3); color: var(--text-primary); margin-left: auto; }
        .msg-bubble.assistant { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
        .msg-bubble p { margin: 0 0 6px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble:has(.improve-card) { max-width: 100%; }
        .improve-card h3 { color: var(--accent); font-size: 1em; margin: 14px 0 6px; }
        .improve-card ul { margin: 0 0 6px 18px; }
        .improve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .improve-grid figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .improve-grid figcaption { font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
        .improve-grid figure.after figcaption { color: var(--accent); }
        .improve-grid img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); background: #fff; display: block; }
        .improve-download { display: inline-block; margin-top: 10px; font-size: 0.85em; color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; }
        .improve-download:hover { color: var(--accent); border-color: var(--accent); }
        @media (max-width: 640px) { .improve-grid { grid-template-columns: 1fr; } }

        /* Comments */
        .comments-section { margin-top: 40px; }
        .comments-section h2 { font-size: 1em; font-weight: 700; margin-bottom: 20px; }
        .comment-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
        .comment-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
        .comment-author { font-size: 0.82em; font-weight: 600; color: var(--accent); }
        .comment-date   { font-size: 0.75em; color: var(--text-muted); }
        .comment-content { font-size: 0.88em; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
        .comment-actions { display: flex; gap: 8px; }
        .comment-action-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75em; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: color 0.15s; }
        .comment-action-btn:hover { color: var(--text-primary); }
        .comment-action-btn.danger:hover { color: var(--danger); }

        /* Comment input */
        .comment-form { margin-top: 20px; }
        .comment-textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 0.88em; padding: 12px 14px; resize: vertical; min-height: 80px; outline: none; transition: border-color 0.15s; }
        .comment-textarea:focus { border-color: var(--accent); }
        .comment-form-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
        .comment-submit-btn { background: var(--accent); border: none; color: var(--accent-ink); font-weight: 600; padding: 8px 18px; border-radius: 8px; font-size: 0.85em; cursor: pointer; transition: opacity 0.15s; }
        .comment-submit-btn:hover { opacity: 0.85; }
        .comment-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .sign-in-prompt { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; margin-top: 20px; }
        .sign-in-prompt p { font-size: 0.88em; color: var(--text-muted); margin-bottom: 12px; }

        /* Sign-in modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.visible { display: flex; }
        .modal-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
        .modal-box h2 { font-size: 1.1em; margin-bottom: 18px; }
        .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.9em; padding: 10px 12px; margin-bottom: 10px; outline: none; }
        .auth-input:focus { border-color: var(--accent); }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #fff; color: #333; border: none; border-radius: 8px; padding: 10px; font-size: 0.9em; font-weight: 500; cursor: pointer; margin-bottom: 12px; transition: opacity 0.15s; }
        .google-btn:hover { opacity: 0.9; }
        .auth-divider { text-align: center; color: var(--text-muted); font-size: 0.8em; margin: 8px 0; }
        .auth-submit-btn { width: 100%; background: var(--accent); border: none; color: var(--accent-ink); font-weight: 600; padding: 10px; border-radius: 8px; font-size: 0.9em; cursor: pointer; margin-top: 4px; }
        .modal-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 1.2em; cursor: pointer; line-height: 1; }
        .auth-error { color: var(--danger); font-size: 0.8em; margin-top: 6px; min-height: 1em; }

        /* CTA */
        .cta-box { margin-top: 56px; background: var(--navy); border-radius: 20px; padding: 36px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .cta-box svg { margin-bottom: 14px; }
        .cta-eyebrow { font-size: 0.72em; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C9D3E0; margin-bottom: 10px; }
        .cta-box h3 { font-family: var(--font-display); font-size: 2em; font-weight: 600; margin-bottom: 10px; line-height: 1.15; color: #fff; }
        .cta-box p  { font-size: 0.95em; color: #DCE3EC; margin-bottom: 22px; line-height: 1.6; max-width: 400px; }
        .cta-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-accent-lg { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; background: var(--accent); color: var(--accent-ink); padding: 0 28px; border-radius: 14px; font-size: 1em; font-weight: 700; text-decoration: none; transition: background 0.15s; }
        .btn-accent-lg:hover { background: #E2D140; }
        .btn-ghost-sm { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; background: transparent; color: #fff; border: 1px solid #4A6A94; padding: 0 22px; border-radius: 14px; font-size: 0.95em; font-weight: 600; text-decoration: none; transition: color 0.15s, border-color 0.15s; }
        .btn-ghost-sm:hover { color: var(--accent); border-color: var(--accent); }
        .cta-proof { margin: 18px 0 0 !important; font-size: 0.8em !important; color: #C9D3E0 !important; }

        /* Mobile share */
        @media (max-width: 600px) {
            .header { padding: 14px 16px; }
            .header-brand span { display: inline; }
            .page-body { padding: 24px 16px 60px; }
            .chart-meta { flex-direction: column; align-items: flex-start; }
            .msg-bubble { max-width: 100%; }
            .cta-box { padding: 24px 20px; }
            .cta-box h3 { font-size: 1.2em; }
            .btn-accent-lg, .btn-ghost-sm { width: 100%; text-align: center; }
        }

        /* States */
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 80px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 80px 24px; }
        .error-state h2 { font-size: 1.2em; margin-bottom: 8px; color: var(--text-muted); }
        .error-state p  { font-size: 0.9em; color: var(--text-muted); }


        @media (max-width: 640px) {
            .header { padding: 14px 16px; }
            .header-brand { font-size: 1em; }
            .page-body { padding: 24px 16px 60px; }
            .chart-meta { flex-direction: column; align-items: flex-start; gap: 6px; }
            .header-actions { gap: 6px; }
            .btn-ghost { display: none; }
            .msg-bubble { max-width: 100%; }
            .header-brand span { display: none; }
            .chart-name { font-size: 2em; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="/" class="header-brand" aria-label="ChartHawk home"><svg width="28" height="28" viewBox="0 0 120 120" fill="none" stroke="#F2E35B" stroke-width="9" stroke-linecap="round" aria-hidden="true"><path d="M89.7 30.3A42 42 0 1 0 89.7 89.7"/><path d="M81.2 38.8A30 30 0 1 0 81.2 81.2"/><path d="M72.7 47.3A18 18 0 1 0 72.7 72.7"/></svg><span>CHARTHAWK</span></a>
    <div class="header-actions">
        <a href="/gallery" class="btn-ghost">Gallery</a>
        <a href="/" class="btn-accent">Audit a chart →</a>
    </div>
</header>

<div class="page-body" id="pageBody">
    <div class="spinner" id="loadingSpinner"></div>
</div>

<!-- Sign-in modal -->
<div class="modal-overlay" id="signInModal">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">✕</button>
        <h2>Sign in to comment</h2>
        <button class="google-btn" id="googleSignIn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
        </button>
        <div class="auth-divider">or</div>
        <input class="auth-input" type="email" id="authEmail" placeholder="Email">
        <input class="auth-input" type="password" id="authPassword" placeholder="Password">
        <button class="auth-submit-btn" id="authSubmit">Sign in</button>
        <div class="auth-error" id="authError"></div>
    </div>
</div>

<script>
    // ── Config ────────────────────────────────────────────────────────────────
    const SUPABASE_URL      = 'https://csjiymeycevxqmlmqcwc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzaml5bWV5Y2V2eHFtbG1xY3djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwOTc1MDUsImV4cCI6MjA4OTY3MzUwNX0.JwUVn-NHrRCmuI8QDe_GEOJfTcT7lcHbh0Fhadrg4h0';
    const CHART_ID          = '{{ chart_id }}';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { flowType: 'implicit' }
    });

    const pageBody      = document.getElementById('pageBody');
    const loadingSpinner= document.getElementById('loadingSpinner');
    const signInModal   = document.getElementById('signInModal');

    let currentUser = null;
    let commentsData= [];

    // ── Auth ──────────────────────────────────────────────────────────────────
    sb.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        refreshCommentInput();
    });

    function getStoredToken() {
        const projectRef = SUPABASE_URL.split('//')[1].split('.')[0];
        const stored = localStorage.getItem(`sb-${projectRef}-auth-token`);
        return stored ? JSON.parse(stored)?.access_token : null;
    }

    // ── Load chart data ───────────────────────────────────────────────────────
    async function loadChart() {
        try {
            const res = await fetch(`/api/share/${CHART_ID}`);
            if (res.status === 404) { renderNotFound(); return; }
            if (!res.ok) throw new Error('Failed to load');
            const { chart, messages } = await res.json();
            renderChart(chart, messages);
            await loadComments();
        } catch (err) {
            renderError();
        }
    }

    function escapeHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
        return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatDateTime(iso) {
        return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderChart(chart, messages) {
        loadingSpinner.remove();
        const name = escapeHtml(chart.display_name || chart.filename || 'Chart');
        const date = formatDate(chart.created_at);

        let html = `
            <img class="chart-img" src="${escapeHtml(chart.image_data)}" alt="${name}">
            <div class="chart-meta">
                <div class="chart-meta-top">
                    <span class="public-pill">Public</span>
                    <span class="chart-date">${date}</span>
                </div>
                <h1 class="chart-name">${name}</h1>
                <p class="chart-subtitle" id="chartSubtitle" hidden></p>
                <button class="copy-link-btn" id="copyLinkBtn">${LINK_ICON}Copy link</button>
            </div>
            <nav class="jump-links" id="jumpLinks" aria-label="Sections" hidden></nav>
            <div class="analysis-content" id="analysisContent">${chart.explanation || ''}</div>
        `;

        if (messages && messages.length > 0) {
            html += `<hr class="section-divider"><div class="section-label">Follow-up conversation</div><div id="threadEl">`;
            messages.forEach(m => {
                const cls  = m.role === 'user' ? 'user' : 'assistant';
                const body = m.html || escapeHtml(m.content);
                html += `<div class="msg-bubble ${cls}">${body}</div>`;
            });
            html += `</div>`;
        }

        html += `
            <div class="comments-section" id="commentsSection">
                <h2>Comments</h2>
                <div id="commentsList"></div>
                <div id="commentInput"></div>
            </div>
            <div class="cta-box">
                <svg width="44" height="44" viewBox="0 0 120 120" fill="none" stroke="#F2E35B" stroke-width="9" stroke-linecap="round" aria-hidden="true"><path d="M89.7 30.3A42 42 0 1 0 89.7 89.7"/><path d="M81.2 38.8A30 30 0 1 0 81.2 81.2"/><path d="M72.7 47.3A18 18 0 1 0 72.7 72.7"/></svg>
                <div class="cta-eyebrow">Free · No credit card</div>
                <h3>Audit your own charts<br>in seconds</h3>
                <p>See what's misleading, what's missing, and what you should push back on — in any chart you upload.</p>
                <div class="cta-actions">
                    <a href="/" class="btn-accent-lg">Audit a chart free →</a>
                    <a href="/gallery" class="btn-ghost-sm">Browse the gallery</a>
                </div>
                <p class="cta-proof">Detects truncated axes · Cherry-picked ranges · Misleading chart types · More</p>
            </div>
        `;

        pageBody.innerHTML = html;
        // Before/after cards store the "Before" image without a src — fill it from the chart.
        pageBody.querySelectorAll('img[data-before]').forEach(img => { img.src = chart.image_data; });
        enhanceAnalysis();

        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(location.href).then(() => {
                const btn = document.getElementById('copyLinkBtn');
                btn.textContent = '✓ Copied!';
                setTimeout(() => { btn.innerHTML = LINK_ICON + 'Copy link'; }, 2000);
            });
        });
    }

    const LINK_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

    // Turn the analysis HTML into numbered sections with jump links,
    // and highlight the "misread" section. Pure presentation: no data changes.
    function enhanceAnalysis() {
        const root = document.getElementById('analysisContent');
        if (!root) return;
        const h1 = root.querySelector(':scope > h1');
        if (h1) {
            const sub = document.getElementById('chartSubtitle');
            sub.textContent = h1.textContent.trim();
            sub.hidden = false;
        }
        const heads = Array.from(root.querySelectorAll(':scope > h2'));
        if (heads.length === 0) return;
        const nav = document.getElementById('jumpLinks');
        heads.forEach((h, i) => {
            const section = document.createElement('section');
            section.className = 'analysis-section';
            h.parentNode.insertBefore(section, h);
            let node = h;
            while (node && !(node !== h && node.tagName === 'H2')) {
                const next = node.nextSibling;
                section.appendChild(node);
                node = next;
            }
            const raw = h.textContent.trim();
            const m = raw.match(/^(\d+)[.)]\s*(.*)$/);
            const num = m ? m[1] : String(i + 1);
            const label = m ? m[2] : raw;
            const id = 'section-' + num;
            h.id = id;
            h.innerHTML = '';
            const badge = document.createElement('span');
            badge.className = 'sec-num'; badge.textContent = num;
            h.appendChild(badge);
            h.appendChild(document.createTextNode(label));
            const isMisread = /misread|misinterpret/i.test(label);
            if (isMisread) section.classList.add('misread');
            const a = document.createElement('a');
            a.href = '#' + id;
            a.textContent = label;
            if (isMisread) a.className = 'warn';
            nav.appendChild(a);
        });
        nav.hidden = false;
    }

    function renderNotFound() {
        loadingSpinner.remove();
        pageBody.innerHTML = `
            <div class="error-state">
                <h2>Chart not found</h2>
                <p>This chart has been removed by its owner or made private.</p>
                <br>
                <a href="/gallery" class="btn-ghost">Browse the Gallery</a>
            </div>`;
    }

    function renderError() {
        loadingSpinner.remove();
        pageBody.innerHTML = `
            <div class="error-state">
                <h2>Something went wrong</h2>
                <p>Couldn't load this chart. Please try again.</p>
                <br>
                <button class="btn-ghost" onclick="location.reload()">Retry</button>
            </div>`;
    }

    // ── Comments ──────────────────────────────────────────────────────────────
    async function loadComments() {
        const listEl = document.getElementById('commentsList');
        if (!listEl) return;
        try {
            const res = await fetch(`/api/chart/${CHART_ID}/comments`);
            if (!res.ok) throw new Error();
            const { comments } = await res.json();
            commentsData = comments || [];
            renderCommentsList();
            refreshCommentInput();
        } catch {
            if (listEl) listEl.innerHTML = `<p style="color:var(--text-muted);font-size:0.85em;">Couldn't load comments.</p>`;
        }
    }

    function renderCommentsList() {
        const listEl = document.getElementById('commentsList');
        if (!listEl) return;
        if (commentsData.length === 0) {
            listEl.innerHTML = `<p style="color:var(--text-muted);font-size:0.85em;margin-bottom:16px;">No comments yet. Be the first!</p>`;
            return;
        }
        listEl.innerHTML = commentsData.map(c => {
            const isOwn    = currentUser && currentUser.id === c.user_id;
            const actions  = isOwn ? `
                <div class="comment-actions">
                    <button class="comment-action-btn" onclick="startEditComment('${c.id}')">Edit</button>
                    <button class="comment-action-btn danger" onclick="deleteComment('${c.id}')">Delete</button>
                </div>` : '';
            return `
                <div class="comment-item" id="comment-${c.id}">
                    <div class="comment-header">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="comment-author">${escapeHtml(c.author_name || 'Anonymous')}</span>
                            <span class="comment-date">${formatDateTime(c.created_at)}${c.updated_at !== c.created_at ? ' (edited)' : ''}</span>
                        </div>
                        ${actions}
                    </div>
                    <div class="comment-content" id="comment-content-${c.id}">${escapeHtml(c.content)}</div>
                </div>`;
        }).join('');
    }

    function refreshCommentInput() {
        const inputEl = document.getElementById('commentInput');
        if (!inputEl) return;
        if (currentUser) {
            inputEl.innerHTML = `
                <div class="comment-form">
                    <textarea class="comment-textarea" id="newCommentText" placeholder="Add a comment…" maxlength="1000"></textarea>
                    <div class="comment-form-footer">
                        <button class="comment-submit-btn" id="submitCommentBtn">Post comment</button>
                    </div>
                </div>`;
            document.getElementById('submitCommentBtn').addEventListener('click', submitComment);
        } else {
            inputEl.innerHTML = `
                <div class="sign-in-prompt">
                    <p>Sign in to leave a comment</p>
                    <button class="btn-accent" id="signInToCommentBtn">Sign in</button>
                </div>`;
            document.getElementById('signInToCommentBtn').addEventListener('click', () => {
                signInModal.classList.add('visible');
            });
        }
    }

    async function submitComment() {
        const textarea = document.getElementById('newCommentText');
        const btn      = document.getElementById('submitCommentBtn');
        const content  = textarea.value.trim();
        if (!content) return;
        btn.disabled = true; btn.textContent = 'Posting…';
        const token = getStoredToken();
        try {
            const res = await fetch(`/api/chart/${CHART_ID}/comments`, {
                method:  'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body:    JSON.stringify({ content }),
            });
            if (!res.ok) throw new Error((await res.json()).error || 'Failed');
            textarea.value = '';
            await loadComments();
        } catch (err) {
            alert('Failed to post comment: ' + err.message);
        } finally {
            btn.disabled = false; btn.textContent = 'Post comment';
        }
    }

    function startEditComment(id) {
        const comment    = commentsData.find(c => c.id === id);
        const contentEl  = document.getElementById(`comment-content-${id}`);
        if (!comment || !contentEl) return;
        contentEl.innerHTML = `
            <textarea class="comment-textarea" id="edit-textarea-${id}" style="min-height:60px;">${escapeHtml(comment.content)}</textarea>
            <div class="comment-form-footer" style="margin-top:6px;">
                <button class="comment-action-btn" onclick="cancelEdit('${id}')">Cancel</button>
                <button class="comment-submit-btn" style="padding:5px 12px;font-size:0.8em;" onclick="saveEdit('${id}')">Save</button>
            </div>`;
    }

    function cancelEdit(id) {
        renderCommentsList();
    }

    async function saveEdit(id) {
        const textarea = document.getElementById(`edit-textarea-${id}`);
        const content  = textarea?.value.trim();
        if (!content) return;
        const token = getStoredToken();
        try {
            const res = await fetch(`/api/comment/${id}`, {
                method:  'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body:    JSON.stringify({ content }),
            });
            if (!res.ok) throw new Error((await res.json()).error || 'Failed');
            const c = commentsData.find(c => c.id === id);
            if (c) { c.content = content; c.updated_at = new Date().toISOString(); }
            renderCommentsList();
        } catch (err) {
            alert('Failed to save: ' + err.message);
        }
    }

    async function deleteComment(id) {
        if (!confirm('Delete this comment?')) return;
        const token = getStoredToken();
        try {
            const res = await fetch(`/api/comment/${id}`, {
                method:  'DELETE',
                headers: { 'Authorization': `Bearer ${token}` },
            });
            if (!res.ok) throw new Error();
            commentsData = commentsData.filter(c => c.id !== id);
            renderCommentsList();
        } catch {
            alert('Failed to delete comment.');
        }
    }

    // ── Sign-in modal ─────────────────────────────────────────────────────────
    document.getElementById('modalClose').addEventListener('click', () => {
        signInModal.classList.remove('visible');
    });

    document.getElementById('googleSignIn').addEventListener('click', async () => {
        await sb.auth.signInWithOAuth({
            provider: 'google',
            options:  { redirectTo: location.href },
        });
    });

    document.getElementById('authSubmit').addEventListener('click', async () => {
        const email    = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const errEl    = document.getElementById('authError');
        errEl.textContent = '';
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { errEl.textContent = error.message; }
        else { signInModal.classList.remove('visible'); }
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    loadChart();
</script>

</body>
</html>
