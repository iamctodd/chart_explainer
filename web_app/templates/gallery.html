<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph / Social -->
    <meta property="og:title" content="Gallery — Charthawk">
    <meta property="og:description" content="See chart analyses shared by the Charthawk community. AI-powered analysis spotting misleading axes, cherry-picked ranges, and distorted scales.">
    <meta property="og:image" content="https://charthawk.info/static/og-image.png">
    <meta property="og:url" content="https://charthawk.info/gallery">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Charthawk">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Browse chart analyses from the Charthawk community.">
    <title>Gallery — Charthawk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='26' fill='%231F3A5F'/><path d='M84 36A34 34 0 1 0 84 84' fill='none' stroke='%23F2E35B' stroke-width='16' stroke-linecap='round'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:        #1F3A5F;
            --bg-base:     #0F1E33;
            --bg-surface:  #132744;
            --bg-card:     #16294A;
            --bg-input:    #1A3256;
            --border:      #2C4A72;
            --text-primary:#F2F5F9;
            --text-muted:  #A9B7CA;
            --accent:      #F2E35B;
            --accent-ink:  #13243B;
            --accent-dim:  rgba(242,227,91,0.12);
            --success:     #4ade80;
            --danger:      #f87171;
            --font-display:'Oswald', 'Arial Narrow', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-base); color: var(--text-primary); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }

        /* Brand header (shared look with share page) */
        .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; background: var(--navy); border-bottom: 0; position: sticky; top: 0; z-index: 10; }
        .header-brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
        .header-brand span { font-family: var(--font-display); font-weight: 500; font-size: 17px; letter-spacing: 0.22em; color: #fff; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-ghost { display: inline-flex; align-items: center; min-height: 40px; background: transparent; border: 1px solid #4A6A94; color: #DCE3EC; padding: 0 16px; border-radius: 999px; font-size: 0.85em; font-weight: 500; text-decoration: none; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-accent { display: inline-flex; align-items: center; min-height: 40px; background: var(--accent); border: none; color: var(--accent-ink); padding: 0 18px; border-radius: 999px; font-size: 0.85em; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 0.15s; font-family: inherit; }
        .btn-accent:hover { background: #E2D140; }

        .page-body { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
        .page-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
        .page-heading { font-family: var(--font-display); font-size: 2.8em; font-weight: 600; line-height: 1.05; margin-bottom: 8px; }
        .page-subhead { color: var(--text-muted); font-size: 1em; }
        .search-box { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; min-height: 44px; flex: 0 1 320px; min-width: 0; }
        .search-box:focus-within { border-color: var(--accent); }
        .search-box input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: 0.95em; }
        .search-box input::placeholder { color: var(--text-muted); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

        .card { background: var(--bg-card); border: 1px solid #22395E; border-radius: 18px; overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
        .card-thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: #F1ECDF; display: block; }
        .card-thumb-placeholder { width: 100%; aspect-ratio: 16/10; background: var(--bg-input); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .card-body { padding: 20px 22px 22px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .card-name { font-size: 1.08em; font-weight: 600; line-height: 1.3; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { display: flex; align-items: center; gap: 10px; font-size: 0.8em; color: var(--text-muted); margin-top: -8px; }
        .comment-badge { background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; font-size: 0.78em; color: var(--text-muted); }

        .card-section-label { font-size: 0.72em; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .card-section-label.warn { color: var(--accent); }
        .card-bullets { list-style: none; display: flex; flex-direction: column; gap: 5px; }
        .card-bullets li { font-size: 0.88em; color: #D3DCE7; line-height: 1.45; padding-left: 14px; position: relative; }
        .card-bullets li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }
        .card-bullets.warn li::before { background: var(--accent); }
        .card-bullets li.empty { font-style: italic; color: var(--text-muted); }
        .card-open { margin-top: auto; padding-top: 4px; font-size: 0.92em; font-weight: 600; color: var(--accent); }
        .no-results { color: var(--text-muted); padding: 40px 0; text-align: center; display: none; }

        .load-more-wrap { text-align: center; margin-top: 40px; }
        .load-more-btn { background: transparent; border: 1px solid var(--border); color: var(--text-primary); min-height: 44px; padding: 0 28px; border-radius: 999px; font-size: 0.92em; font-family: inherit; cursor: pointer; transition: all 0.15s; }
        .load-more-btn:hover { border-color: var(--accent); color: var(--accent); }
        .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 80px 24px; color: var(--text-muted); }
        .empty-state h2 { font-size: 1.2em; margin-bottom: 8px; color: var(--text-primary); }
        .empty-state p { font-size: 0.9em; }

        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 60px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 560px) {
            .header { padding: 12px 16px; }
            .header-brand span { display: none; }
            .page-body { padding: 28px 16px 60px; }
            .page-heading { font-size: 2.1em; }
            .search-box { flex-basis: 100%; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="/" class="header-brand" aria-label="ChartHawk home"><svg width="28" height="28" viewBox="0 0 120 120" fill="none" stroke="#F2E35B" stroke-width="9" stroke-linecap="round" aria-hidden="true"><path d="M89.7 30.3A42 42 0 1 0 89.7 89.7"/><path d="M81.2 38.8A30 30 0 1 0 81.2 81.2"/><path d="M72.7 47.3A18 18 0 1 0 72.7 72.7"/></svg><span>CHARTHAWK</span></a>
    <div class="header-actions">
        <a href="/dashboard" class="btn-ghost">My analyses</a>
        <a href="/" class="btn-accent">Analyze a chart →</a>
    </div>
</header>

<div class="page-body">
    <div class="page-top">
        <div>
            <h1 class="page-heading">Public Gallery</h1>
            <p class="page-subhead">Chart analyses shared by the ChartHawk community</p>
        </div>
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B7CA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <label for="gallerySearch" class="sr-only">Search the gallery</label>
            <input id="gallerySearch" type="search" placeholder="Search the gallery">
        </div>
    </div>

    <div id="loadingSpinner"><div class="spinner"></div></div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <p class="no-results" id="noResults">No analyses match that search.</p>
    <div id="emptyState" class="empty-state" style="display:none;">
        <h2>Nothing here yet</h2>
        <p>Be the first to share a chart analysis with the community.</p>
    </div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
        <button class="load-more-btn" id="loadMoreBtn">Load more</button>
    </div>
</div>

<script>
    const grid        = document.getElementById('galleryGrid');
    const spinner     = document.getElementById('loadingSpinner');
    const emptyState  = document.getElementById('emptyState');
    const loadMoreWrap= document.getElementById('loadMoreWrap');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    let currentPage = 0;
    let loading     = false;

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildCard(chart) {
        const name    = escapeHtml(chart.display_name || chart.filename || 'Untitled');
        const date    = formatDate(chart.created_at);
        const summary = chart.gallery_summary || {};
        const insights     = summary.insights     || [];
        const improvements = summary.improvements || [];

        const thumbHtml = chart.thumbnail_data
            ? `<img class="card-thumb" src="${escapeHtml(chart.thumbnail_data)}" alt="${name}" loading="lazy">`
            : `<div class="card-thumb-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 3v18h17"/><path d="M8 17v-5M13 17V8M18 17v-9"/></svg></div>`;

        const insightItems = insights.length
            ? insights.map(i => `<li>${escapeHtml(i)}</li>`).join('')
            : '<li class="empty">No summary yet</li>';

        const improvItems = improvements.length
            ? improvements.map(i => `<li>${escapeHtml(i)}</li>`).join('')
            : '<li class="empty">Nothing flagged</li>';

        const card = document.createElement('a');
        card.href      = `/share/${chart.id}`;
        card.className = 'card';
        card.dataset.search = (chart.display_name || chart.filename || '').toLowerCase();
        card.innerHTML = `
            ${thumbHtml}
            <div class="card-body">
                <div class="card-name" title="${name}">${name}</div>
                <div class="card-meta">
                    <span>${date}</span>
                </div>
                <div>
                    <div class="card-section-label">Key findings</div>
                    <ul class="card-bullets">${insightItems}</ul>
                </div>
                <div>
                    <div class="card-section-label warn">Watch out for</div>
                    <ul class="card-bullets warn">${improvItems}</ul>
                </div>
                <span class="card-open">Open analysis →</span>
            </div>
        `;
        return card;
    }

    async function loadPage(page) {
        if (loading) return;
        loading = true;
        if (page === 0) spinner.style.display = 'block';
        else loadMoreBtn.disabled = true;

        try {
            const res = await fetch(`/api/gallery?page=${page}`);
            if (!res.ok) throw new Error('Failed to load gallery');
            const { charts } = await res.json();

            if (page === 0) spinner.style.display = 'none';

            if (charts.length === 0 && page === 0) {
                emptyState.style.display = 'block';
                return;
            }

            charts.forEach(c => grid.appendChild(buildCard(c)));
            applySearch();

            if (charts.length === 20) {
                loadMoreWrap.style.display = 'block';
                loadMoreBtn.disabled = false;
                currentPage = page + 1;
            } else {
                loadMoreWrap.style.display = 'none';
            }
        } catch (err) {
            spinner.style.display = 'none';
            grid.innerHTML = `<p style="color:var(--danger);padding:20px;">Failed to load gallery. Please try again.</p>`;
        } finally {
            loading = false;
        }
    }

    // Client-side search over the analyses loaded so far
    const searchInput = document.getElementById('gallerySearch');
    const noResults   = document.getElementById('noResults');
    function applySearch() {
        const q = searchInput.value.trim().toLowerCase();
        let shown = 0;
        grid.querySelectorAll('.card').forEach(c => {
            const match = !q || c.dataset.search.includes(q);
            c.style.display = match ? '' : 'none';
            if (match) shown++;
        });
        noResults.style.display = (q && shown === 0) ? 'block' : 'none';
    }
    searchInput.addEventListener('input', applySearch);

    loadMoreBtn.addEventListener('click', () => loadPage(currentPage));
    loadPage(0);
</script>
</body>
</html>
